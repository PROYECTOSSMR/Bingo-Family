<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingo Familiar</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@400;600;800&display=swap">
<style>
/* Concepto: salon de bingo de noche. Fieltro verde, bolas de colores, cartones de papel.
   Una sola mirada (oscura) por decision del diseno. */
:root{
  color-scheme: dark;
  --bg:#0c2a23; --bg-2:#0f352c; --panel:#134238; --line:#2a6153;
  --ink:#f3efe2; --muted:#9dc2b4;
  --gold:#f4c542; --gold-ink:#2b2200;
  --paper:#f6f1e3; --paper-ink:#18241f; --paper-line:#cfc6ad; --dab:#e0445a;
  --cB:#3b82f6; --cI:#ef4444; --cN:#cfcab9; --cG:#22c55e; --cO:#f59e0b;
  --ok:#4ade80; --bad:#fb7185;
  --display:'Bowlby One','Arial Black',Impact,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.45;
  padding-block:8px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.app{max-width:1000px; margin:0 auto; display:flex; flex-direction:column; gap:16px}
h1,h2{margin:0}
h1{font-family:var(--display); font-weight:400; font-size:clamp(28px,6vw,44px); letter-spacing:.5px; line-height:1.05}
h1 span{color:var(--gold)}
h2{font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-bottom:10px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible, input:focus-visible, select:focus-visible{outline:3px solid var(--gold); outline-offset:2px}
.top{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between}
.sala{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.sala label{display:flex; gap:8px; align-items:center; font-weight:700; color:var(--muted)}
input[type=text], input[type=number], select{
  font:inherit; color:var(--ink); background:var(--bg-2); border:2px solid var(--line); border-radius:10px;
  padding:8px 12px; min-width:0;
}
input[type=text]{width:150px}
input[type=number]{width:96px}
.chip{display:inline-flex; align-items:center; gap:8px; padding:6px 12px; border-radius:999px; background:var(--bg-2); border:2px solid var(--line); font-weight:800; font-size:14px}
.dot{width:10px; height:10px; border-radius:50%; background:var(--muted)}
.chip.live .dot{background:var(--ok); box-shadow:0 0 0 4px rgba(74,222,128,.2)}
.tabs{display:grid; grid-template-columns:1fr 1fr; gap:8px; background:var(--bg-2); padding:6px; border-radius:16px; border:2px solid var(--line)}
.tab{border:0; border-radius:11px; background:transparent; padding:12px 8px; font-weight:800; font-size:17px; color:var(--muted)}
.tab[aria-selected=true]{background:var(--gold); color:var(--gold-ink)}
.panel{background:var(--panel); border:2px solid var(--line); border-radius:18px; padding:16px; min-width:0}
.btn{border:0; border-radius:12px; padding:12px 18px; font-weight:800; background:var(--bg-2); border:2px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn-gold{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.btn-gold:hover{filter:brightness(1.06); border-color:var(--gold)}
.btn-xl{font-size:22px; padding:16px 28px; width:100%}
.btn[disabled]{opacity:.5; cursor:not-allowed}
.link{background:none; border:0; padding:4px; color:var(--muted); text-decoration:underline; font-size:14px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.small{font-size:14px; color:var(--muted)}
.grid-host{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:16px; align-items:start}
.grid-host .wide{grid-column:1 / -1}
.stack{display:flex; flex-direction:column; gap:16px; min-width:0}
@media (max-width:760px){ .grid-host{grid-template-columns:minmax(0,1fr)} }

/* Bolas */
.ball{--c:var(--cN); position:relative; border-radius:50%; background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--c) 70%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 70%, #000)); display:grid; place-items:center; flex:none}
.ball::before{content:""; position:absolute; inset:19%; border-radius:50%; background:#fffdf5; box-shadow:inset 0 -3px 6px rgba(0,0,0,.12)}
.ball .t{position:relative; display:flex; flex-direction:column; align-items:center; color:#111a16; font-family:var(--display); line-height:1}
.ball .l{font-size:.2em; opacity:.8; margin-bottom:.04em}
.ball .n{font-size:.34em; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.ball-xl{width:min(240px,62vw); aspect-ratio:1; font-size:min(240px,62vw); margin:6px auto 4px; box-shadow:0 14px 28px rgba(0,0,0,.35)}
.ball-md{width:84px; height:84px; font-size:84px; box-shadow:0 8px 16px rgba(0,0,0,.3)}
.ball-sm{width:44px; height:44px; font-size:44px}
.ball.empty{--c:#2a4d43}
.c-B{--c:var(--cB)} .c-I{--c:var(--cI)} .c-N{--c:var(--cN)} .c-G{--c:var(--cG)} .c-O{--c:var(--cO)}
.pop{animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4) rotate(-20deg); opacity:.2} to{transform:none; opacity:1}}
.ultimas{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; min-height:44px; margin-top:10px}
.opts{display:flex; flex-direction:column; gap:8px; margin-top:12px; font-weight:600}
.opts label{display:flex; gap:8px; align-items:center}
input[type=checkbox]{width:20px; height:20px; accent-color:var(--gold)}

/* Tablero maestro */
.tablero{display:grid; gap:4px; overflow-x:auto}
.tr{display:grid; grid-template-columns:26px repeat(15, minmax(20px,1fr)); gap:3px; align-items:center}
.tl{font-family:var(--display); font-size:18px; text-align:center}
.tl.B{color:var(--cB)} .tl.I{color:var(--cI)} .tl.N{color:var(--cN)} .tl.G{color:var(--cG)} .tl.O{color:var(--cO)}
.cell{aspect-ratio:1; display:grid; place-items:center; border-radius:6px; font-size:12px; font-weight:800; background:var(--bg-2); color:#5f8a7b; font-variant-numeric:tabular-nums}
.cell.on{color:#111a16}
.cell.on.B{background:var(--cB)} .cell.on.I{background:var(--cI)} .cell.on.N{background:var(--cN)} .cell.on.G{background:var(--cG)} .cell.on.O{background:var(--cO)}
.cell.last{outline:3px solid var(--gold); outline-offset:1px}

/* Figuras */
.figuras{display:flex; flex-wrap:wrap; gap:8px}
.fig{display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:12px; border:2px solid var(--line); background:var(--bg-2); font-weight:800}
.fig[aria-pressed=true]{border-color:var(--gold); background:#1d4f43}
.mini{display:grid; grid-template-columns:repeat(5,8px); gap:2px}
.mini i{display:block; width:8px; height:8px; border-radius:2px; background:#2d5b4e}
.mini i.on{background:var(--gold)}
.fig-actual{display:flex; align-items:center; gap:12px; font-weight:800}
.fig-actual .mini{grid-template-columns:repeat(5,10px)} .fig-actual .mini i{width:10px; height:10px}

/* Jugadores / reclamos */
.lista{display:flex; flex-direction:column; gap:8px}
.jug{display:flex; justify-content:space-between; gap:10px; align-items:center; padding:8px 12px; background:var(--bg-2); border-radius:12px; font-weight:700}
.jug.claim{border:2px solid var(--gold)}
.tag{padding:3px 10px; border-radius:999px; font-size:13px; font-weight:800; white-space:nowrap}
.tag.ok{background:rgba(74,222,128,.18); color:var(--ok)}
.tag.no{background:rgba(251,113,133,.18); color:var(--bad)}
.vacio{color:var(--muted); font-size:14px}

/* Cartones */
.cartones{display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%,300px),1fr)); gap:16px}
.carton{background:var(--paper); color:var(--paper-ink); border-radius:18px; padding:12px; box-shadow:0 10px 22px rgba(0,0,0,.3); display:flex; flex-direction:column; gap:10px}
.carton .cab{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.carton .cab b{font-family:var(--display); font-weight:400; font-size:26px; text-align:center; border-radius:10px; color:#fff; padding:2px 0}
.cab b.B{background:var(--cB)} .cab b.I{background:var(--cI)} .cab b.N{background:#8d8870} .cab b.G{background:var(--cG)} .cab b.O{background:var(--cO)}
.carton .mat{display:grid; grid-template-columns:repeat(5,1fr); gap:6px}
.nm{position:relative; aspect-ratio:1; border:2px solid var(--paper-line); border-radius:12px; background:#fffdf6; color:var(--paper-ink); font-family:var(--display); font-size:clamp(18px,5vw,26px); display:grid; place-items:center; font-variant-numeric:tabular-nums; padding:0}
.nm:hover{border-color:#8a8466}
.nm.libre{font-size:13px; font-family:var(--body); font-weight:800; background:#efe8d0}
.nm.salio::after{content:""; position:absolute; right:5px; top:5px; width:9px; height:9px; border-radius:50%; background:var(--gold); border:2px solid #b98f0c}
.nm.on{color:#fff; background:var(--dab); border-color:var(--dab); transform:scale(.94)}
.nm.on.libre{background:var(--dab)}
.carton .pie{display:flex; justify-content:space-between; align-items:center; gap:8px}
.carton .pie .link{color:#5b5640}
.btn-bingo{background:var(--dab); border-color:var(--dab); color:#fff; font-family:var(--display); font-weight:400; font-size:20px; letter-spacing:.5px; padding:10px 18px}

/* Banner y aviso */
#banner{position:fixed; inset:0; z-index:30; display:grid; place-items:center; background:rgba(5,20,16,.78); padding:24px; text-align:center}
#banner[hidden]{display:none}
#banner .caja{background:var(--gold); color:var(--gold-ink); border-radius:28px; padding:28px 36px; max-width:520px; box-shadow:0 20px 60px rgba(0,0,0,.5); animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
#banner .grande{font-family:var(--display); font-size:clamp(44px,14vw,86px); line-height:1}
#banner .quien{font-weight:800; font-size:20px; margin-top:8px}
#toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom, 0px)); transform:translateX(-50%); background:#fffdf3; color:#15241e; padding:10px 18px; border-radius:999px; font-weight:800; z-index:40; box-shadow:0 8px 24px rgba(0,0,0,.4); max-width:90vw; text-align:center}
#toast[hidden]{display:none}
.nota{font-size:14px; color:var(--muted)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){ .pop, #banner .caja{animation:none} }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <h1>Bingo <span>Familiar</span></h1>
    <div class="sala">
      <label>Sala <input type="text" id="inp-sala" maxlength="30" autocomplete="off" spellcheck="false"></label>
      <button class="btn" id="btn-sala">Entrar</button>
      <span class="chip" id="chip-estado"><span class="dot"></span><span id="txt-estado">Sin conexión</span></span>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Vista">
    <button class="tab" role="tab" id="tab-jugar" aria-selected="true">Jugar</button>
    <button class="tab" role="tab" id="tab-cantar" aria-selected="false">Cantar las bolas</button>
  </nav>

  <!-- ================= JUGAR ================= -->
  <section id="v-jugar" class="stack">
    <div class="panel">
      <div class="row" style="justify-content:space-between">
        <label class="row" style="font-weight:700">Tu nombre
          <input type="text" id="inp-nombre" maxlength="20" placeholder="Ej: Abuela" autocomplete="off">
        </label>
        <label class="row" style="font-weight:600"><input type="checkbox" id="chk-ayuda"> Señalar los números que ya salieron</label>
      </div>
    </div>

    <div class="panel">
      <h2>Última bola</h2>
      <div class="row" style="gap:18px; align-items:center">
        <div id="j-bola" class="ball ball-md empty"></div>
        <div style="min-width:0; flex:1">
          <div class="fig-actual"><span id="j-fig-mini"></span><span id="j-fig-nombre"></span></div>
          <div class="small" id="j-cuenta">0 bolas cantadas</div>
          <div class="ultimas" id="j-ultimas" style="justify-content:flex-start; min-height:0; margin-top:8px"></div>
        </div>
      </div>
      <div id="j-manual" class="row" style="margin-top:14px; border-top:2px solid var(--line); padding-top:14px">
        <span class="small" style="flex-basis:100%" id="j-manual-nota"></span>
        <input type="number" id="inp-manual" min="1" max="75" inputmode="numeric" placeholder="1 a 75" aria-label="Número cantado">
        <button class="btn" id="btn-manual">Anotar número</button>
        <select id="sel-fig-manual" aria-label="Figura para ganar"></select>
        <button class="link" id="btn-limpiar-manual">Borrar los números anotados</button>
      </div>
    </div>

    <div id="j-reclamos" class="lista"></div>

    <div id="cartones" class="cartones"></div>
    <div class="row">
      <button class="btn btn-gold" id="btn-add">Agregar otro cartón</button>
      <span class="nota" id="nota-cartones"></span>
    </div>
  </section>

  <!-- ================= CANTAR ================= -->
  <section id="v-cantar" hidden>
    <div class="grid-host">
      <div class="stack">
        <div class="panel" style="text-align:center">
          <h2 style="text-align:left">Bola actual</h2>
          <div id="h-bola" class="ball ball-xl empty"></div>
          <button class="btn btn-gold btn-xl" id="btn-sacar">Sacar bola</button>
          <div class="row" style="justify-content:space-between; margin-top:10px">
            <span class="small" id="h-cuenta">0 de 75</span>
            <button class="link" id="btn-deshacer">Quitar la última</button>
          </div>
          <div class="ultimas" id="h-ultimas"></div>
          <div class="opts" style="text-align:left">
            <label><input type="checkbox" id="chk-voz"> Cantar en voz alta</label>
            <label><input type="checkbox" id="chk-auto"> Sacar solas cada
              <select id="sel-seg"><option value="6">6</option><option value="10">10</option><option value="15">15</option><option value="20">20</option></select> segundos</label>
          </div>
        </div>
        <div class="panel">
          <h2>Partida</h2>
          <button class="btn" id="btn-nueva" style="width:100%">Nueva partida</button>
          <p class="nota" id="h-nota-sala" style="margin:10px 0 0"></p>
        </div>
      </div>
      <div class="stack">
        <div class="panel">
          <h2>Figura para ganar</h2>
          <div class="figuras" id="h-figuras"></div>
        </div>
        <div class="panel">
          <h2>Jugadores en la sala</h2>
          <div id="h-jugadores" class="lista"></div>
        </div>
      </div>
      <div class="panel wide">
        <h2>Tablero</h2>
        <div class="tablero" id="h-tablero"></div>
      </div>
    </div>
  </section>
</div>

<div id="banner" hidden role="alertdialog" aria-live="assertive">
  <div class="caja"><div class="grande">¡BINGO!</div><div class="quien" id="banner-quien"></div><button class="btn" id="banner-cerrar" style="margin-top:16px; color:var(--ink)">Cerrar</button></div>
</div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* ---------- Constantes ---------- */
var LET = 'BINGO';
var RANGOS = [[1,15],[16,30],[31,45],[46,60],[61,75]];
function rango(arr){ return arr; }
var FILAS = [], COLS5 = [];
for (var r=0;r<5;r++){ var f=[],c=[]; for (var k=0;k<5;k++){ f.push(r*5+k); c.push(k*5+r); } FILAS.push(f); COLS5.push(c); }
var FIGURAS = {
  linea:   { nombre:'Línea', sets: FILAS.concat(COLS5, [[0,6,12,18,24],[4,8,12,16,20]]), vista:[10,11,12,13,14] },
  esquinas:{ nombre:'Cuatro esquinas', sets:[[0,4,20,24]], vista:[0,4,20,24] },
  equis:   { nombre:'Equis (X)', sets:[[0,6,12,18,24,4,8,16,20]], vista:[0,6,12,18,24,4,8,16,20] },
  marco:   { nombre:'Marco', sets:[[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24]], vista:[0,1,2,3,4,5,9,10,14,15,19,20,21,22,23,24] },
  lleno:   { nombre:'Cartón lleno', sets:[(function(){var a=[];for(var i=0;i<25;i++)a.push(i);return a;})()], vista:(function(){var a=[];for(var i=0;i<25;i++)a.push(i);return a;})() }
};
var ORDEN_FIG = ['linea','esquinas','equis','marco','lleno'];
var MAX_CARTONES = 4;
var KEY = 'bingo-familiar-v1';

/* ---------- Estado ---------- */
function nuevoId(){ return Date.now().toString(36) + Math.floor(Math.random()*1296).toString(36); }
var S = {
  nombre:'', sala:'familia', tab:'jugar', ayuda:true, voz:false,
  cartones:[], marcas:[],
  jug:{ g:'', llamados:[], p:'linea' },
  host:{ g:nuevoId(), llamados:[], p:'linea', auto:false, seg:10 }
};
function cargar(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return;
    var d = JSON.parse(raw);
    if(typeof d.nombre==='string') S.nombre = d.nombre.slice(0,20);
    if(typeof d.sala==='string') S.sala = d.sala;
    if(d.tab==='cantar'||d.tab==='jugar') S.tab = d.tab;
    if(typeof d.ayuda==='boolean') S.ayuda = d.ayuda;
    if(typeof d.voz==='boolean') S.voz = d.voz;
    if(Array.isArray(d.cartones) && Array.isArray(d.marcas)){
      var cs=[], ms=[];
      for(var i=0;i<d.cartones.length && i<MAX_CARTONES;i++){
        if(cartonValido(d.cartones[i]) && Array.isArray(d.marcas[i]) && d.marcas[i].length===25){ cs.push(d.cartones[i]); ms.push(d.marcas[i].map(Boolean)); }
      }
      S.cartones = cs; S.marcas = ms;
    }
    if(d.jug && typeof d.jug.g==='string' && listaBolas(d.jug.llamados)){ S.jug.g = d.jug.g.slice(0,24); S.jug.llamados = d.jug.llamados.slice(); if(FIGURAS[d.jug.p]) S.jug.p = d.jug.p; }
    if(d.host && typeof d.host.g==='string' && listaBolas(d.host.llamados)){
      S.host.g = d.host.g.slice(0,24); S.host.llamados = d.host.llamados.slice();
      if(FIGURAS[d.host.p]) S.host.p = d.host.p;
      S.host.seg = [6,10,15,20].indexOf(+d.host.seg)>=0 ? +d.host.seg : 10;
    }
  }catch(e){}
}
function guardar(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

function listaBolas(a){
  if(!Array.isArray(a) || a.length>75) return false;
  var vistos={};
  for(var i=0;i<a.length;i++){ var n=a[i]; if(!Number.isInteger(n)||n<1||n>75||vistos[n]) return false; vistos[n]=1; }
  return true;
}
function cartonValido(c){
  if(!Array.isArray(c)||c.length!==25) return false;
  for(var i=0;i<25;i++){
    if(i===12){ if(c[i]!==0) return false; }
    else{
      var n=c[i], col=i%5;
      if(!Number.isInteger(n)||n<RANGOS[col][0]||n>RANGOS[col][1]) return false;
    }
  }
  return true;
}

/* ---------- Utilidades ---------- */
function $(id){ return document.getElementById(id); }
function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function letraDe(n){ return LET.charAt(Math.floor((n-1)/15)); }
function mezclar(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function nuevoCarton(){
  var c=new Array(25);
  for(var col=0; col<5; col++){
    var pool=[]; for(var n=RANGOS[col][0]; n<=RANGOS[col][1]; n++) pool.push(n);
    mezclar(pool);
    for(var r=0;r<5;r++) c[r*5+col]=pool[r];
  }
  c[12]=0;
  return c;
}
function marcasVacias(){ var m=[]; for(var i=0;i<25;i++) m.push(i===12); return m; }
function completo(carton, setLlamados, figura){
  var f = FIGURAS[figura] || FIGURAS.linea;
  for(var s=0;s<f.sets.length;s++){
    var ok=true, set=f.sets[s];
    for(var k=0;k<set.length;k++){ var i=set[k]; if(i!==12 && !setLlamados[carton[i]]){ ok=false; break; } }
    if(ok) return true;
  }
  return false;
}
function comoSet(arr){ var o={}; for(var i=0;i<arr.length;i++) o[arr[i]]=true; return o; }
var toastT=null;
function toast(msg){ var t=$('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(function(){ t.hidden=true; }, 2600); }
function hablar(n){
  if(!S.voz || !('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(letraDe(n)+'. '+n);
    u.lang='es-CO'; u.rate=0.9;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function pintarBola(node, n, conPop){
  node.textContent='';
  node.className = node.className.replace(/\b(empty|c-[BINGO]|pop)\b/g,'').replace(/\s+/g,' ').trim();
  if(!n){ node.classList.add('empty'); return; }
  node.classList.add('c-'+letraDe(n));
  var t=el('div','t'); t.appendChild(el('span','l',letraDe(n))); t.appendChild(el('span','n',String(n)));
  node.appendChild(t);
  node.setAttribute('aria-label', letraDe(n)+' '+n);
  if(conPop){ void node.offsetWidth; node.classList.add('pop'); }
}
function miniFigura(key, pequena){
  var m=el('span','mini'); var on=comoSet(FIGURAS[key].vista);
  for(var i=0;i<25;i++){ var c=el('i', on[i]?'on':''); m.appendChild(c); }
  return m;
}
function nombreLimpio(s){ return String(s==null?'':s).replace(/[\u0000-\u001f\u007f-\u009f\u200b-\u200f\u2028-\u202f\u2060-\u206f\ufeff]/g,'').trim().slice(0,20); }

/* ---------- Sala en vivo (room) ---------- */
var roomApi=null, room=null, offs=[], conectado=false, recibioEstado=false, miClaim=null, sinPermisoEmitir=false, estadoSala='sin';
function codigoSala(s){ return String(s||'').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9_.-]/g,'').replace(/^[^a-z0-9]+/,'').slice(0,40); }

function pintarEstado(){
  var chip=$('chip-estado'), txt=$('txt-estado');
  chip.classList.remove('live');
  if(!roomApi){ txt.textContent='Sin sala en vivo (modo manual)'; return; }
  if(!room){ txt.textContent = estadoSala==='uniendo' ? 'Entrando a la sala…' : 'Sin sala'; return; }
  if(!conectado){ txt.textContent='Reconectando…'; return; }
  var n = jugadoresOtros().length;
  txt.textContent = 'En vivo · ' + n + (n===1?' jugador':' jugadores');
  chip.classList.add('live');
}
function limpiarSuscripciones(){ offs.forEach(function(f){ try{f();}catch(e){} }); offs=[]; }

async function unirse(){
  var codigo = codigoSala(S.sala);
  if(!codigo){ toast('Escribe un nombre de sala'); return; }
  S.sala = codigo; $('inp-sala').value = codigo; guardar();
  if(!roomApi){ pintarEstado(); return; }
  limpiarSuscripciones();
  if(room){ try{ room.leave(); }catch(e){} room=null; }
  conectado=false; recibioEstado=false; estadoSala='uniendo'; pintarEstado();
  try{
    room = await roomApi.join(codigo);
  }catch(e){ room=null; estadoSala='error'; pintarEstado(); toast('No se pudo entrar a la sala'); renderTodo(); return; }
  estadoSala='ok';
  offs.push(room.on('estado', alRecibirEstado, function(){}));
  offs.push(room.onPeers(function(){ pintarEstado(); renderJugadoresHost(); renderReclamos(); if(S.tab==='cantar') difundir(); }, function(){}));
  offs.push(room.onConnection(function(c){ conectado=c; pintarEstado(); }, function(){}));
  conectado = room.connected();
  publicarPresencia();
  if(S.tab==='cantar') difundir();
  renderTodo();
}

function publicarPresencia(){
  if(!room) return;
  var patch = S.tab==='cantar'
    ? { rol:'anfitrion', nombre:null, cartones:null, claim:null }
    : { rol:'jugador', nombre: nombreLimpio(S.nombre)||'Jugador', cartones:S.cartones, claim:miClaim };
  try{ room.presence(patch).catch(function(){}); }catch(e){}
}
function difundir(){
  if(!room || S.tab!=='cantar') return;
  var d={ g:S.host.g, c:S.host.llamados, p:S.host.p };
  try{
    room.emit('estado', d).then(function(){ sinPermisoEmitir=false; }).catch(function(e){
      if(e && e.code==='not_permitted'){ sinPermisoEmitir=true; renderNotaSala(); }
    });
  }catch(e){}
}
setInterval(function(){ if(S.tab==='cantar') difundir(); }, 5000);

function alRecibirEstado(msg){
  if(!msg || msg.isMe || msg.kind!=='viewer') return;
  var d=msg.data;
  if(!d || typeof d.g!=='string' || d.g.length>24 || !listaBolas(d.c) || !FIGURAS[d.p]) return;
  var anterior = S.jug.llamados.length ? S.jug.llamados[S.jug.llamados.length-1] : 0;
  if(S.jug.g !== d.g){
    S.jug.g = d.g;
    S.marcas = S.cartones.map(marcasVacias);
    miClaim = null; publicarPresencia();
  }
  S.jug.llamados = d.c.slice(); S.jug.p = d.p; recibioEstado=true;
  guardar();
  var nueva = S.jug.llamados.length ? S.jug.llamados[S.jug.llamados.length-1] : 0;
  renderJugar(nueva && nueva!==anterior);
  renderReclamos();
  if(nueva && nueva!==anterior) hablar(nueva);
}

function jugadoresOtros(){
  if(!room) return [];
  return room.peers().filter(function(p){ return !p.isMe && p.presence && p.presence.rol==='jugador'; });
}
function reclamosActuales(g, llamados, figura){
  var set=comoSet(llamados), res=[];
  jugadoresOtros().forEach(function(p){
    var cl=p.presence.claim, cs=p.presence.cartones;
    if(!cl || cl.g!==g || !Array.isArray(cs)) return;
    var carton = cs[cl.idx|0];
    if(!cartonValido(carton)) return;
    res.push({ nombre: nombreLimpio(p.presence.nombre)||'Jugador', ok: completo(carton, set, figura), peer:p.peer, n:cl.n });
  });
  return res;
}

/* ---------- Vista JUGAR ---------- */
function renderJugar(animar){
  var ll = S.jug.llamados, ultima = ll.length ? ll[ll.length-1] : 0;
  pintarBola($('j-bola'), ultima, !!animar);
  $('j-cuenta').textContent = ll.length + (ll.length===1?' bola cantada':' bolas cantadas');
  var f=$('j-fig-mini'); f.textContent=''; f.appendChild(miniFigura(S.jug.p));
  $('j-fig-nombre').textContent = 'Figura: ' + FIGURAS[S.jug.p].nombre;
  var u=$('j-ultimas'); u.textContent='';
  ll.slice(-8,-1).reverse().forEach(function(n){ var b=el('div','ball ball-sm'); pintarBola(b,n); u.appendChild(b); });

  var manual = !(room && recibioEstado);
  $('j-manual').hidden = !manual;
  $('j-manual-nota').textContent = room
    ? 'Esperando que el anfitrión cante la primera bola. Mientras tanto puedes anotar los números a mano.'
    : 'Sin conexión en vivo: anota aquí cada número que canten en voz alta.';
  $('sel-fig-manual').value = S.jug.p;

  renderCartones();
}
function renderCartones(){
  var cont=$('cartones'); cont.textContent='';
  var set=comoSet(S.jug.llamados);
  S.cartones.forEach(function(c, idx){
    var card=el('div','carton');
    var cab=el('div','cab'); LET.split('').forEach(function(l){ cab.appendChild(el('b',l,l)); }); card.appendChild(cab);
    var mat=el('div','mat');
    for(var i=0;i<25;i++){
      var libre = i===12;
      var b=el('button','nm'+(libre?' libre':''), libre?'LIBRE':String(c[i]));
      b.type='button';
      if(S.marcas[idx][i]) b.classList.add('on');
      if(!libre && S.ayuda && set[c[i]]) b.classList.add('salio');
      b.setAttribute('aria-pressed', S.marcas[idx][i] ? 'true':'false');
      if(!libre) b.setAttribute('aria-label', 'Número '+c[i]);
      (function(ix,pos,boton){
        if(pos===12) { boton.disabled=true; return; }
        boton.addEventListener('click', function(){ S.marcas[ix][pos] = !S.marcas[ix][pos]; guardar(); renderCartones(); });
      })(idx,i,b);
      mat.appendChild(b);
    }
    card.appendChild(mat);
    var pie=el('div','pie');
    var nuevo=el('button','link','Cambiar números'); nuevo.type='button';
    nuevo.addEventListener('click', function(){ S.cartones[idx]=nuevoCarton(); S.marcas[idx]=marcasVacias(); guardar(); publicarPresencia(); renderCartones(); });
    pie.appendChild(nuevo);
    var rowR=el('div','row');
    if(S.cartones.length>1){
      var q=el('button','link','Quitar'); q.type='button';
      q.addEventListener('click', function(){ S.cartones.splice(idx,1); S.marcas.splice(idx,1); miClaim=null; guardar(); publicarPresencia(); renderCartones(); });
      rowR.appendChild(q);
    }
    var bb=el('button','btn btn-bingo','¡BINGO!'); bb.type='button';
    bb.addEventListener('click', function(){ cantarBingo(idx); });
    rowR.appendChild(bb);
    pie.appendChild(rowR);
    card.appendChild(pie);
    cont.appendChild(card);
  });
  $('btn-add').disabled = S.cartones.length>=MAX_CARTONES;
  $('nota-cartones').textContent = S.cartones.length + ' de ' + MAX_CARTONES + ' cartones';
}
function cantarBingo(idx){
  var ok = completo(S.cartones[idx], comoSet(S.jug.llamados), S.jug.p);
  if(!ok){ toast('Todavía no completas la figura con los números cantados'); return; }
  miClaim = { idx:idx, g:S.jug.g, n:Date.now()%100000 };
  publicarPresencia();
  mostrarBanner(nombreLimpio(S.nombre)||'Tú');
}
function mostrarBanner(quien){ $('banner-quien').textContent = quien; $('banner').hidden=false; $('banner-cerrar').focus(); }

function renderReclamos(){
  var cont=$('j-reclamos'); cont.textContent='';
  if(S.tab!=='jugar') return;
  var rs = reclamosActuales(S.jug.g, S.jug.llamados, S.jug.p);
  rs.forEach(function(r){
    var row=el('div','jug claim');
    row.appendChild(el('span','', r.nombre+' cantó BINGO'));
    row.appendChild(el('span','tag '+(r.ok?'ok':'no'), r.ok?'Válido':'No completa la figura'));
    cont.appendChild(row);
  });
}

/* ---------- Vista CANTAR ---------- */
var autoTimer=null;
function renderCantar(animar){
  var H=S.host, ll=H.llamados, ultima = ll.length ? ll[ll.length-1] : 0;
  pintarBola($('h-bola'), ultima, !!animar);
  $('h-cuenta').textContent = ll.length + ' de 75';
  var u=$('h-ultimas'); u.textContent='';
  ll.slice(-7,-1).reverse().forEach(function(n){ var b=el('div','ball ball-sm'); pintarBola(b,n); u.appendChild(b); });
  $('btn-sacar').disabled = ll.length>=75;
  $('btn-deshacer').disabled = ll.length===0;
  $('chk-voz').checked = S.voz;
  $('chk-auto').checked = H.auto;
  $('sel-seg').value = String(H.seg);

  // figuras
  var fg=$('h-figuras'); fg.textContent='';
  ORDEN_FIG.forEach(function(k){
    var b=el('button','fig'); b.type='button'; b.setAttribute('aria-pressed', H.p===k?'true':'false');
    b.appendChild(miniFigura(k)); b.appendChild(el('span','',FIGURAS[k].nombre));
    b.addEventListener('click', function(){ H.p=k; guardar(); renderCantar(); difundir(); });
    fg.appendChild(b);
  });

  // tablero
  var tb=$('h-tablero'); tb.textContent='';
  var set=comoSet(ll);
  for(var r=0;r<5;r++){
    var tr=el('div','tr'); tr.appendChild(el('div','tl '+LET[r], LET[r]));
    for(var n=RANGOS[r][0]; n<=RANGOS[r][1]; n++){
      var c=el('div','cell '+LET[r]+(set[n]?' on':'')+(n===ultima?' last':''), String(n));
      tr.appendChild(c);
    }
    tb.appendChild(tr);
  }
  renderJugadoresHost();
  renderNotaSala();
}
function renderJugadoresHost(){
  var cont=$('h-jugadores'); if(!cont) return; cont.textContent='';
  if(S.tab!=='cantar') return;
  var js=jugadoresOtros();
  if(!room){ cont.appendChild(el('div','vacio','Sin sala en vivo. Canta las bolas en voz alta o muestra esta pantalla en la tele.')); return; }
  if(!js.length){ cont.appendChild(el('div','vacio','Todavía no hay jugadores. Pídeles que abran el enlace en la sala "'+S.sala+'".')); return; }
  var rs=reclamosActuales(S.host.g, S.host.llamados, S.host.p);
  js.forEach(function(p){
    var nombre=nombreLimpio(p.presence.nombre)||'Jugador';
    var cs=Array.isArray(p.presence.cartones)?p.presence.cartones.length:0;
    var mio=null; rs.forEach(function(r){ if(r.peer===p.peer) mio=r; });
    var row=el('div','jug'+(mio?' claim':''));
    row.appendChild(el('span','', nombre + (cs?'  ·  '+cs+(cs===1?' cartón':' cartones'):'')));
    if(mio) row.appendChild(el('span','tag '+(mio.ok?'ok':'no'), mio.ok?'¡BINGO válido!':'Dice bingo, pero no completa'));
    cont.appendChild(row);
  });
  rs.forEach(function(r){
    var clave=r.peer+':'+r.n+':'+S.host.g;
    if(r.ok && !avisados[clave]){ avisados[clave]=true; mostrarBanner(r.nombre); }
  });
}
var avisados={};
function renderNotaSala(){
  var n=$('h-nota-sala'); if(!n) return;
  if(!room) n.textContent='Sin sala en vivo: los números solo se ven en esta pantalla.';
  else if(sinPermisoEmitir) n.textContent='Esta cuenta no puede transmitir en vivo. Solo el dueño del bingo o quien tenga permiso de edición puede cantar las bolas.';
  else n.textContent='Los jugadores entran a la sala "'+S.sala+'" y ven cada bola al instante.';
}
function sacarBola(){
  var H=S.host;
  if(H.llamados.length>=75){ toast('Ya salieron las 75 bolas'); pararAuto(); return; }
  var resto=[]; for(var n=1;n<=75;n++) if(H.llamados.indexOf(n)<0) resto.push(n);
  var n2=resto[Math.floor(Math.random()*resto.length)];
  H.llamados.push(n2); guardar(); hablar(n2); renderCantar(true); difundir();
  if(H.llamados.length>=75) pararAuto();
}
function pararAuto(){ if(autoTimer){ clearInterval(autoTimer); autoTimer=null; } S.host.auto=false; guardar(); if($('chk-auto')) $('chk-auto').checked=false; }
function ponerAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer=null; }
  if(S.host.auto){ autoTimer=setInterval(sacarBola, S.host.seg*1000); }
}
var confirmaNueva=null;
function nuevaPartida(){
  var b=$('btn-nueva');
  if(!confirmaNueva){
    b.textContent='¿Seguro? Toca otra vez para borrar las bolas';
    confirmaNueva=setTimeout(function(){ confirmaNueva=null; b.textContent='Nueva partida'; }, 4000);
    return;
  }
  clearTimeout(confirmaNueva); confirmaNueva=null; b.textContent='Nueva partida';
  pararAuto();
  S.host.g=nuevoId(); S.host.llamados=[]; guardar(); renderCantar(); difundir();
  toast('Partida nueva lista');
}

/* ---------- Pestañas ---------- */
function irA(tab){
  S.tab=tab; guardar();
  $('tab-jugar').setAttribute('aria-selected', tab==='jugar'?'true':'false');
  $('tab-cantar').setAttribute('aria-selected', tab==='cantar'?'true':'false');
  $('v-jugar').hidden = tab!=='jugar';
  $('v-cantar').hidden = tab!=='cantar';
  publicarPresencia();
  if(tab==='cantar'){ renderCantar(); difundir(); } else { renderJugar(); renderReclamos(); }
}
function renderTodo(){ if(S.tab==='cantar') renderCantar(); else { renderJugar(); renderReclamos(); } pintarEstado(); }

/* ---------- Eventos ---------- */
function iniciar(){
  cargar();
  if(!S.cartones.length){ S.cartones=[nuevoCarton()]; S.marcas=[marcasVacias()]; }
  var sel=$('sel-fig-manual'); ORDEN_FIG.forEach(function(k){ var o=el('option','',FIGURAS[k].nombre); o.value=k; sel.appendChild(o); });
  $('inp-sala').value=S.sala; $('inp-nombre').value=S.nombre; $('chk-ayuda').checked=S.ayuda;

  $('tab-jugar').addEventListener('click', function(){ irA('jugar'); });
  $('tab-cantar').addEventListener('click', function(){ irA('cantar'); });
  $('btn-sala').addEventListener('click', function(){ S.sala=$('inp-sala').value; unirse(); });
  $('inp-sala').addEventListener('keydown', function(e){ if(e.key==='Enter'){ S.sala=$('inp-sala').value; unirse(); } });
  $('inp-nombre').addEventListener('input', function(e){ S.nombre=nombreLimpio(e.target.value); guardar(); });
  $('inp-nombre').addEventListener('change', function(){ publicarPresencia(); });
  $('chk-ayuda').addEventListener('change', function(e){ S.ayuda=e.target.checked; guardar(); renderCartones(); });
  $('btn-add').addEventListener('click', function(){
    if(S.cartones.length>=MAX_CARTONES) return;
    S.cartones.push(nuevoCarton()); S.marcas.push(marcasVacias()); guardar(); publicarPresencia(); renderCartones();
  });
  $('btn-manual').addEventListener('click', anotarManual);
  $('inp-manual').addEventListener('keydown', function(e){ if(e.key==='Enter') anotarManual(); });
  $('sel-fig-manual').addEventListener('change', function(e){ if(FIGURAS[e.target.value]){ S.jug.p=e.target.value; guardar(); renderJugar(); } });
  $('btn-limpiar-manual').addEventListener('click', function(){ S.jug.llamados=[]; S.marcas=S.cartones.map(marcasVacias); miClaim=null; guardar(); publicarPresencia(); renderJugar(); });
  $('banner-cerrar').addEventListener('click', function(){ $('banner').hidden=true; });

  $('btn-sacar').addEventListener('click', sacarBola);
  $('btn-deshacer').addEventListener('click', function(){ if(S.host.llamados.length){ S.host.llamados.pop(); guardar(); renderCantar(); difundir(); } });
  $('chk-voz').addEventListener('change', function(e){ S.voz=e.target.checked; guardar(); });
  $('chk-auto').addEventListener('change', function(e){ S.host.auto=e.target.checked; guardar(); ponerAuto(); });
  $('sel-seg').addEventListener('change', function(e){ S.host.seg=+e.target.value; guardar(); ponerAuto(); });
  $('btn-nueva').addEventListener('click', nuevaPartida);

  S.host.auto=false; // al abrir la pagina el modo automatico siempre arranca apagado
  irA(S.tab);
  pintarEstado();

  // Sala en vivo: se activa si la plataforma la ofrece; la pagina funciona sin ella
  (async function(){
    try{
      if(window.claude && typeof window.claude.use==='function') roomApi = await window.claude.use('room');
    }catch(e){ roomApi=null; }
    pintarEstado();
    if(roomApi) unirse(); else renderTodo();
  })();
}
function anotarManual(){
  var inp=$('inp-manual'), n=parseInt(inp.value,10);
  if(!Number.isInteger(n)||n<1||n>75){ toast('Escribe un número entre 1 y 75'); return; }
  if(S.jug.llamados.indexOf(n)>=0){ toast('Ese número ya estaba anotado'); inp.value=''; return; }
  S.jug.llamados.push(n); inp.value=''; guardar(); renderJugar(true); inp.focus();
}
iniciar();
})();
</script>
